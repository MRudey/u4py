image: debian:12

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python3 --version ; python3 -m pip --version  # For debugging
  - apt-get install -y libgdal-dev g++ binutils libproj-dev gdal-bin --no-install-recommends
  - python3 -m pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate

pages:
  stage: deploy
  environment: production
  script:
      - python3 -m pip install sphinx sphinx_rtd_theme
      - python3 -m pip install .
      - sphinx-apidoc -f -e -M -o doc/source .
      - sphinx-build -d doc/build doc/source public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH